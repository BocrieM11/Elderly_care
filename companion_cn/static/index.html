<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温暖陪伴 — 养老聊天</title>
<style>
  :root {
    --bg: #faf7f2;
    --panel-bg: #fffbf5;
    --bubble-user: #e8f0e8;
    --bubble-sakura: #fff0ed;
    --accent: #c97a5e;
    --accent-light: #f5d5c8;
    --text: #3d302b;
    --text-light: #8c7b72;
    --border: #e8e0d5;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  header {
    background: #fff; padding: 14px 28px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,.03);
    flex: 0 0 auto;
  }
  header .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-light); }
  .dialect-selector {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-light);
  }
  .dialect-selector label { white-space: nowrap; font-size: 12px; }
  .dialect-selector select {
    padding: 5px 10px; border: 1px solid var(--border);
    border-radius: 14px; font-size: 13px; outline: none;
    background: #fff; color: var(--text);
    cursor: pointer; font-family: inherit;
  }
  .dialect-selector select:focus { border-color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: minmax(280px, 360px) minmax(420px, 1fr) minmax(250px, 310px);
    flex: 1 1 0; height: 0; min-height: 0; overflow: hidden;
    background: #f6f2ec;
  }
  .video-panel {
    padding: 20px 16px;
    background: #fffaf5;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .video-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .video-heading h2 { font-size:16px; font-weight:600; }
  .video-status { font-size:11px; color:#7d746b; background:#f2e9df; border-radius:999px; padding:4px 8px; white-space:nowrap; }
  .video-stage {
    position: relative; overflow: hidden; aspect-ratio: 4 / 5;
    min-height: 260px; border-radius: 20px;
    background: linear-gradient(145deg, #4e565d, #24282d);
    box-shadow: 0 8px 22px rgba(62, 48, 42, .16);
  }
  .video-stage video { width:100%; height:100%; object-fit:cover; display:block; background:#24282d; }
  .video-placeholder { position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.3)); }
  .camera-controls { display:flex; gap:8px; }
  .camera-toggle { flex:1; border:0; border-radius:12px; padding:10px 14px; background:var(--accent); color:#fff; cursor:pointer; font:600 13px inherit; transition:opacity .2s, transform .2s; }
  .camera-toggle:hover { transform:translateY(-1px); }
  .camera-toggle:disabled { cursor:wait; opacity:.6; transform:none; }
  .camera-toggle.active { background:#7b6a5d; }
  .reminder-center-button { display:inline-flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--border); padding:5px 10px; border-radius:14px; font-size:12px; color:var(--accent); cursor:pointer; font-family:inherit; }
  .reminder-badge { display:none; min-width:16px; padding:0 4px; border-radius:9px; background:#d66b55; color:#fff; font-size:10px; line-height:16px; text-align:center; }
  .reminder-modal { position:fixed; inset:0; z-index:1200; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(57,43,36,.38); }
  .reminder-card { width:min(420px, 100%); border-radius:24px; background:#fffdfa; padding:26px; text-align:center; box-shadow:0 16px 48px rgba(48,35,27,.25); }
  .reminder-bell { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 14px; border-radius:50%; background:#fff0e8; font-size:28px; }
  .reminder-card h2 { font-size:20px; margin-bottom:10px; }
  .reminder-card p { color:var(--text-light); font-size:15px; line-height:1.7; margin-bottom:20px; word-break:break-word; }
  .reminder-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .reminder-actions button { border:0; border-radius:14px; padding:13px 10px; font:inherit; font-size:15px; cursor:pointer; }
  .reminder-complete { background:var(--accent); color:#fff; }
  .reminder-snooze { background:#f4ede6; color:var(--text); }
  .reminder-dismiss { grid-column:1 / -1; background:transparent; color:var(--text-light); font-size:13px !important; padding:7px !important; }
  .reminder-confirm { background:var(--accent); color:#fff; }
  .reminder-cancel { background:#f4ede6; color:var(--text); }
  .reminder-center-card { width:min(580px, 100%); max-height:min(78vh, 680px); display:flex; flex-direction:column; border-radius:22px; overflow:hidden; background:#fffdfa; box-shadow:0 16px 48px rgba(48,35,27,.25); }
  .reminder-center-header { padding:20px 22px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .reminder-center-header h2 { font-size:19px; }
  .reminder-center-header button { border:0; background:none; color:var(--text-light); cursor:pointer; font-size:22px; }
  .reminder-list { padding:10px 16px 18px; overflow-y:auto; }
  .reminder-item { padding:14px 12px; border-bottom:1px solid #f0e8df; display:grid; grid-template-columns:1fr auto; gap:8px; }
  .reminder-item:last-child { border-bottom:0; }
  .reminder-item-title { font-size:15px; font-weight:600; margin-bottom:4px; }
  .reminder-item-meta { color:var(--text-light); font-size:12px; line-height:1.55; }
  .reminder-state { align-self:start; border-radius:999px; padding:4px 8px; font-size:11px; white-space:nowrap; }
  .reminder-state.active { background:#eaf3ea; color:#487452; }
  .reminder-state.notified { background:#fff0e8; color:#b76445; }
  .reminder-state.completed { background:#edf1f4; color:#607080; }
  .reminder-state.pending_confirmation { background:#f6efe4; color:#8c7048; }
  .reminder-state.cancelled { background:#f1f1f1; color:#777; }
  .reminder-empty { padding:40px 18px; text-align:center; color:var(--text-light); font-size:14px; }
  .chat-panel {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0; height: 100%; max-height: 100%;
    background: #fffdf9;
  }
  .messages {
    flex: 1 1 0; height: 0; overflow-y: auto; padding: 24px 28px;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 0; scroll-behavior: smooth;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .msg-row {
    display: flex; gap: 10px; max-width: 85%;
    animation: fadeIn .25s ease;
  }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.li { align-self: flex-start; }
  .msg-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .msg-row.user .msg-avatar { background: #dce8dc; }
  .msg-row.li .msg-avatar { background: var(--accent-light); }
  .msg-bubble {
    padding: 11px 16px; border-radius: var(--radius);
    font-size: 15px; line-height: 1.7;
    word-break: break-word;
  }
  .msg-row.user .msg-bubble {
    background: var(--bubble-user);
    border-bottom-right-radius: 5px;
  }
  .msg-row.li .msg-bubble {
    background: var(--bubble-sakura);
    border-bottom-left-radius: 5px;
  }
  .emotion-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
    color: #fff;
    vertical-align: middle;
  }
  .emotion-badge.joy        { background: #c97a5e; }
  .emotion-badge.sadness    { background: #7b9ec7; }
  .emotion-badge.loneliness { background: #8b7ec7; }
  .emotion-badge.calm       { background: #7eb8a0; }
  .emotion-badge.nostalgia  { background: #c9a05e; }
  .emotion-badge.surprise   { background: #e8734a; }
  .emotion-badge.anger      { background: #c95555; }
  .emotion-badge.excited    { background: #d4a83c; }
  .emotion-badge.anxiety    { background: #9b8ec7; }
  .emotion-badge.blush      { background: #e8a0b0; }
  .emotion-badge.neutral    { background: #b0a89c; }

  #petAvatar {
    transition: background 0.3s, transform 0.3s;
    user-select: none;
  }
  #petAvatar.pet-joy        { background: #f5d0a8; animation: petBounce 0.5s; }
  #petAvatar.pet-sadness    { background: #b0c8e0; animation: petSway 1.2s ease-in-out infinite; }
  #petAvatar.pet-loneliness { background: #c0b8e0; animation: petSway 1.0s ease-in-out infinite; }
  #petAvatar.pet-neutral    { background: var(--accent-light); }
  #petAvatar.pet-nostalgia  { background: #e8d5b8; }
  #petAvatar.pet-surprise   { background: #f0b8a0; animation: petJump 0.4s; }
  #petAvatar.pet-anger      { background: #e08080; animation: petShake 0.4s; }
  #petAvatar.pet-excited    { background: #f0d080; animation: petBounce 0.35s; }

  @keyframes petBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }
  @keyframes petShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @keyframes petJump {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes petSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(4deg); }
  }

  .msg-time {
    font-size: 10px; color: var(--text-light);
    margin-top: 4px; text-align: right;
  }
  .msg-row.user .msg-time { text-align: left; }

  .input-area {
    padding: 16px 28px 22px;
    background: #fff; border-top: 1px solid var(--border);
    display: flex; gap: 10px; flex: 0 0 auto;
    position: relative; z-index: 2;
  }
  .input-area button {
    padding: 12px 28px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 28px;
    font-size: 15px; cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  .input-area button:hover { background: #b06a50; }
  .input-area button:disabled { opacity: .5; cursor: not-allowed; }
  .input-area #micBtn { background:#fff; color:var(--accent); border:1px solid var(--accent); white-space:nowrap; }
  .input-area #micBtn.recording { background:#c94c4c; color:#fff; border-color:#c94c4c; }
  .voice-status { align-self:center; color:var(--text-light); font-size:12px; white-space:nowrap; }

  /* Log panel */
  .log-panel {
    min-width: 0;
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .log-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .log-header .count {
    font-size: 12px; color: var(--text-light); font-weight: 400;
  }
  .log-header button {
    background: none; border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 12px;
    font-size: 11px; color: var(--text-light); cursor: pointer;
  }
  .log-header button:hover { background: #f0e8e0; }
  .log-list {
    flex: 1 1 0; min-height:0; overflow-y: auto; padding: 8px 0;
  }
  .log-item {
    padding: 12px 20px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    font-size: 13px; line-height: 1.5;
  }
  .log-item:hover { background: #faf3e8; }
  .log-item .log-round {
    font-weight: 600; font-size: 11px; color: var(--accent);
    margin-bottom: 2px;
  }
  .log-item .log-time {
    font-size: 10px; color: var(--text-light);
  }
  .log-item .log-preview {
    margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text);
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

  .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-light);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 1050px) {
    main { grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); }
    .log-panel { display: none; }
  }
  @media (max-width: 760px) {
    header { padding: 10px 14px; gap: 8px; }
    header .sub, .dialect-selector label, #notificationButton { display:none; }
    main { display:flex; flex-direction:column; height:0; overflow-y:auto; overflow-x:hidden; }
    .video-panel { padding:12px 14px; border-right:0; border-bottom:1px solid var(--border); }
    .video-stage { aspect-ratio:16/8; min-height:150px; }
    .chat-panel { min-height:55vh; height:auto; max-height:none; flex:1 0 auto; }
    .log-panel { display: none; }
    .messages { height:auto; padding:16px; min-height:280px; max-height:58vh; overflow-y:auto; }
    .input-area { padding:12px 14px 16px; }
  }

  /* Independent draggable digital companion imported from the avatar branch. */
  #digitalAvatarPanel {
    position: fixed;
    left: 22px;
    bottom: 22px;
    z-index: 500;
    width: min(238px, 30vw);
    min-width: 180px;
    aspect-ratio: 4 / 5;
    background: transparent;
    cursor: grab;
    touch-action: none;
    user-select: none;
    filter: drop-shadow(0 12px 18px rgba(58, 43, 36, .24));
  }
  #digitalAvatarPanel.dragging { cursor: grabbing; }
  #digitalAvatarPanel #avatarCutout {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  #digitalAvatarPanel.action-change #avatarCutout {
    animation: avatarActionPop .32s ease-out;
  }
  #digitalAvatarPanel .avatar-caption {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 2;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(61,48,43,.68);
    color: #fff;
    font-size: 11px;
    letter-spacing: .04em;
    pointer-events: none;
  }
  @keyframes avatarActionPop {
    0% { opacity: .55; transform: scale(.96); }
    100% { opacity: 1; transform: scale(1); }
  }
  @media (max-width: 760px) {
    #digitalAvatarPanel {
      left: 12px;
      bottom: 12px;
      width: min(158px, 42vw);
      min-width: 128px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="avatar" id="petAvatar">💛</div>
  <div style="flex:1">
    <h1>温暖陪伴</h1>
    <div class="sub">耐心倾听 · 真诚回应 · 像老朋友一样</div>
  </div>
  <div class="dialect-selector">
    <a href="/news.html" style="color:var(--accent);text-decoration:none;margin-right:8px;font-size:13px">新闻</a>
    <button id="reminderCenterButton" class="reminder-center-button" type="button" onclick="showReminderCenter()">🔔 提醒 <span class="reminder-badge" id="reminderBadge">0</span></button>
    <button id="notificationButton" type="button" onclick="enableReminderNotifications()" style="background:#fff;border:1px solid var(--border);padding:5px 10px;border-radius:14px;font-size:12px;color:var(--accent);cursor:pointer;font-family:inherit">开启提醒通知</button>
    <label for="dialectSelect">口语风格</label>
    <select id="dialectSelect" onchange="onDialectChange()"></select>
  </div>
</header>

<main>
  <aside class="video-panel" aria-label="视频通话区域">
    <div class="video-heading">
      <h2>视频陪伴</h2>
      <span class="video-status" id="videoStatus">摄像头已关闭</span>
    </div>
    <div class="video-stage" id="videoStage">
      <video id="companionVideo" autoplay playsinline muted></video>
      <div class="video-placeholder" id="videoPlaceholder"></div>
    </div>
    <div class="camera-controls">
      <button class="camera-toggle" id="cameraToggle" type="button" onclick="companionCamera.toggle()">开启摄像头</button>
    </div>
  </aside>
  <aside id="digitalAvatarPanel" aria-label="可拖动的数字人陪伴">
    <img id="avatarCutout" src="/avatar/welcome_wave_isnet_clean_pingpong.png?v=pingpong1" alt="暖暖陪伴数字人">
    <div class="avatar-caption" id="avatarCaption">欢迎陪伴</div>
  </aside>
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <button id="micBtn" type="button" onclick="companionVoice.toggle()">🎙 正在开启语音识别…</button>
      <span class="voice-status" id="voiceStatus">语音检测中</span>
    </div>
  </div>

  <div class="log-panel" id="logPanel">
    <div class="log-header">
      <span>聊天记录 <span class="count" id="logCount">0轮</span></span>
      <div style="display:flex;gap:6px;">
        <button onclick="showHistory()">历史</button>
        <button onclick="exportLog()">导出</button>
        <button onclick="clearLog()">结束本次聊天</button>
      </div>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty" style="padding:40px 20px;text-align:center;color:var(--text-light);font-size:13px">
        还没开始聊天<br>随便聊聊吧 💛
      </div>
    </div>
  </div>
</main>

<div class="reminder-modal" id="reminderModal" role="dialog" aria-modal="true" aria-labelledby="reminderTitle">
  <div class="reminder-card">
    <div class="reminder-bell">🔔</div>
    <h2 id="reminderTitle">时间到了</h2>
    <p id="reminderText"></p>
    <div class="reminder-actions">
      <button class="reminder-complete" onclick="completeReminderFromModal()">我已完成</button>
      <button class="reminder-snooze" onclick="snoozeReminderFromModal()">10分钟后提醒</button>
      <button class="reminder-dismiss" onclick="hideReminderModal()">暂时关闭（仍保留提醒）</button>
    </div>
  </div>
</div>

<div class="reminder-modal" id="reminderConfirmModal" role="dialog" aria-modal="true" aria-labelledby="reminderConfirmTitle">
  <div class="reminder-card">
    <div class="reminder-bell">⏰</div>
    <h2 id="reminderConfirmTitle">确认设置提醒</h2>
    <p id="reminderConfirmText"></p>
    <div class="reminder-actions">
      <button class="reminder-confirm" onclick="confirmReminderFromModal()">确认设置</button>
      <button class="reminder-cancel" onclick="cancelPendingReminderFromModal()">暂不设置</button>
    </div>
  </div>
</div>

<div class="reminder-modal" id="reminderCenterModal" role="dialog" aria-modal="true" aria-labelledby="reminderCenterTitle">
  <div class="reminder-center-card">
    <div class="reminder-center-header">
      <h2 id="reminderCenterTitle">提醒记录</h2>
      <button type="button" onclick="hideReminderCenter()" aria-label="关闭">×</button>
    </div>
    <div class="reminder-list" id="reminderList"><div class="reminder-empty">正在加载提醒记录…</div></div>
  </div>
</div>

<!-- 历史记录 -->
<div class="modal-overlay" id="historyModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center">
  <div style="background:#fff;border-radius:16px;width:90%;max-width:700px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.15)">
    <div style="padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600">
      <span id="modalTitle">聊天历史</span>
      <button onclick="closeHistory()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-light)">✕</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px 24px" id="modalBody"></div>
  </div>
</div>

<script>
// Tailscale Serve exposes /v1 on the same HTTPS origin. Local HTTP access on
// port 12393 still talks directly to the Companion service on port 8016.
const COMPANION_API_ORIGIN = window.location.port === '8016' || window.location.protocol === 'https:'
  ? ''
  : `${window.location.protocol}//${window.location.hostname}:8016`;
const browserFetch = window.fetch.bind(window);

const companionCamera = (() => {
  const video = document.getElementById('companionVideo');
  const placeholder = document.getElementById('videoPlaceholder');
  const status = document.getElementById('videoStatus');
  const button = document.getElementById('cameraToggle');
  const canvas = document.createElement('canvas');
  let stream = null;

  function updateUi(mode) {
    const active = mode === 'active';
    status.textContent = active ? '摄像头已开启' : mode === 'error' ? '摄像头不可用' : '摄像头已关闭';
    button.textContent = active ? '关闭摄像头' : '开启摄像头';
    button.classList.toggle('active', active);
    placeholder.style.display = active ? 'none' : 'flex';
  }

  function stop() {
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;
    updateUi('idle');
  }

  async function start() {
    if (!navigator.mediaDevices?.getUserMedia) {
      updateUi('error');
      return;
    }
    button.disabled = true;
    status.textContent = '正在请求权限';
    try {
      // This runs inside the camera button's user gesture and unlocks later
      // wave-triggered TTS playback on browsers with autoplay restrictions.
      window.companionVoice?.prepare?.();
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 640 },
          height: { ideal: 480 },
          facingMode: 'user',
        },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      stream.getVideoTracks().forEach(track => {
        track.addEventListener('ended', () => {
          if (stream) stop();
        }, { once: true });
      });
      updateUi('active');
    } catch (error) {
      console.error('Failed to start camera:', error);
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      updateUi('error');
    } finally {
      button.disabled = false;
    }
  }

  async function toggle() {
    if (stream) stop();
    else await start();
  }

  function isActive() {
    return Boolean(stream && stream.active && video.readyState >= 2);
  }

  function capture() {
    if (!isActive()) return null;
    const sourceWidth = video.videoWidth || 640;
    const sourceHeight = video.videoHeight || 480;
    const width = Math.min(640, sourceWidth);
    const height = Math.max(1, Math.round(sourceHeight * (width / sourceWidth)));
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d', { alpha: false });
    if (!context) return null;
    context.drawImage(video, 0, 0, width, height);
    return {
      data: canvas.toDataURL('image/jpeg', 0.76),
      mime_type: 'image/jpeg',
      captured_at_ms: Date.now(),
    };
  }

  window.addEventListener('beforeunload', stop);
  return { toggle, capture, isActive };
})();
window.companionCamera = companionCamera;

    goodnight:    { src: '/avatar/goodnight_big_wave_transparent_pingpong.png?v=pingpong1', label: '晚安陪伴' },
  };
  const idleActions = ['welcome', 'care', 'stretch'];
  let currentAction = 'welcome';
  let resetTimer = null;
  let idleTimer = null;
  let loadGeneration = 0;

  function scheduleIdleRotation() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const choices = idleActions.filter(action => action !== currentAction);
      play(choices[Math.floor(Math.random() * choices.length)] || 'welcome');
    }, 10000 + Math.random() * 6000);
  }

  function applyAction(action, item, generation) {
    if (generation !== loadGeneration) return;
    currentAction = action;
    image.src = item.src;
    image.alt = `暖暖陪伴数字人：${item.label}`;
    caption.textContent = item.label;
    panel.classList.remove('action-change');
    void panel.offsetWidth;
    panel.classList.add('action-change');
    if (action !== 'welcome') {
      const delay = ['comfort', 'big_comfort', 'care'].includes(action) ? 6500 : 3200;
      resetTimer = setTimeout(() => play('welcome'), delay);
    } else {
      scheduleIdleRotation();
    }
  }

  function play(action) {
    const item = actions[action] || actions.care;
    const selectedAction = actions[action] ? action : 'care';
    clearTimeout(resetTimer);
    clearTimeout(idleTimer);
    const generation = ++loadGeneration;
    if (image.getAttribute('src') === item.src || image.src.endsWith(item.src)) {
      applyAction(selectedAction, item, generation);
      return;
    }
    const preload = new Image();
    preload.onload = () => applyAction(selectedAction, item, generation);
    preload.onerror = () => {
      if (generation === loadGeneration && currentAction !== 'welcome') play('welcome');
    };
    preload.src = item.src;
  }

  const storageKey = 'companion-avatar-position-v1';
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  function clamp(left, top) {
    const rect = panel.getBoundingClientRect();
    return {
      left: Math.max(0, Math.min(left, window.innerWidth - rect.width)),
      top: Math.max(0, Math.min(top, window.innerHeight - rect.height)),
    };
  }

  function place(left, top, persist = true) {
    const position = clamp(left, top);
    panel.style.left = `${Math.round(position.left)}px`;
    panel.style.top = `${Math.round(position.top)}px`;
    panel.style.bottom = 'auto';
    if (persist) localStorage.setItem(storageKey, JSON.stringify(position));
  }

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)) {
      place(saved.left, saved.top, false);
    }
  } catch (_) {
    // Ignore an invalid browser-local position.
  }

  panel.addEventListener('pointerdown', event => {
    if (event.button !== undefined && event.button !== 0) return;
    const rect = panel.getBoundingClientRect();
    dragging = true;
    offsetX = event.clientX - rect.left;
    offsetY = event.clientY - rect.top;
    panel.classList.add('dragging');
    panel.setPointerCapture?.(event.pointerId);
    event.preventDefault();
  });
  panel.addEventListener('pointermove', event => {
    if (dragging) place(event.clientX - offsetX, event.clientY - offsetY);
  });
  function stopDragging(event) {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('dragging');
    panel.releasePointerCapture?.(event?.pointerId);
  }
  panel.addEventListener('pointerup', stopDragging);
  panel.addEventListener('pointercancel', stopDragging);
  window.addEventListener('resize', () => {
    const rect = panel.getBoundingClientRect();
    if (panel.style.top) place(rect.left, rect.top);
  });

  scheduleIdleRotation();
  return { play };
})();

function playReminderTone() {
  // A short local tone does not depend on any music service. Browsers may
  // suppress it until the person has interacted with the page at least once.
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, context.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.8);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime + 0.85);
  } catch (e) {}
}

}

function reminderTiming(reminder) {
  const due = new Date(reminder.due_at);
  if (reminder.status === 'active') {
    const minutes = Math.ceil((due.getTime() - Date.now()) / 60000);
    if (minutes <= 0) return '即将提醒';
    if (minutes < 60) return `还剩约${minutes}分钟`;
    const hours = Math.floor(minutes / 60);
    return `还剩约${hours}小时${minutes % 60}分钟`;
  }
  if (reminder.status === 'notified') return '已到提醒时间，等待处理';
  if (reminder.status === 'completed') return '已处理并完成';
  if (reminder.status === 'pending_confirmation') return '尚未确认，不会提醒';
  return '已取消';
}

async function send(options = {}) {
  const internalEvent = options.internalEvent || null;
  const text = String(options.text || '').trim();
  const loggedUserText = internalEvent
    ? (internalEvent.event_type === 'fall_detected'
      ? '安全关怀（检测到跌倒）'
      : internalEvent.event_type === 'wave_detected'
        ? '主动问候（检测到挥手）'
        : internalEvent.event_type === 'voice_wake_detected'
          ? `主动问候（语音唤醒：${internalEvent.wake_phrase || ''}）`
        : '主动关怀（检测到坐起）')
    : text;
  if (!text) return;
  if (messageSendBusy) return false;
  const turnAbortController = new AbortController();
  let resolveTurnCompletion;
  activeChatCompletion = new Promise(resolve => { resolveTurnCompletion = resolve; });
  activeChatAbortController = turnAbortController;
  companionVoice.begin();
  messageSendBusy = true;

  if (!internalEvent) addBubble('user', text, 'user');

  if (messages.length === 0) {
    messages.push({ role: 'system', content: '' });
  }
  messages.push({ role: 'user', content: text });

  const MAX_MSGS = 1 + 10 * 2;
  if (messages.length > MAX_MSGS) {
    messages = [messages[0], ...messages.slice(-MAX_MSGS + 1)];
  }

  const replyRow = addBubble('li',
    '<span class="typing-dots"><span></span><span></span><span></span></span>', 'li', true);
  const bubble = replyRow.querySelector('.msg-bubble');

  try {
    const images = [];
    if (!internalEvent && companionCamera.isActive()) {
      const frame = companionCamera.capture();
      if (frame) images.push(frame);
    }
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: turnAbortController.signal,
      body: JSON.stringify({
        message: text,
        messages: messages,
        user_id: userId,
        session_id: sessionId,
        dialect: currentDialect,
        images: images,
      }),
    });
    if (!res.ok || !res.body) {
      throw new Error(`聊天服务暂时不可用（${res.status}）`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let reply = '';
    let finalEmotion = null;
    let finalAvatarAction = null;
    let newsContext = null;
    let reminderContext = null;
    let streamError = null;

    const consumeSseLine = rawLine => {
      const line = rawLine.replace(/\r$/, '');
      if (!line.startsWith('data: ')) return;
      try {
        const c = JSON.parse(line.slice(6));
        if (c.token && !c.done) {
          reply += c.token;
          companionVoice.push(c.token);
          bubble.textContent = reply;
          scrollDown();
        }
        if (c.done) {
          finalEmotion = c.emotion || null;
          finalAvatarAction = c.avatar_action || null;
          newsContext = c.news || null;
          reminderContext = c.reminder || null;
          streamError = c.error || null;
        }
      } catch (error) {
        console.warn('忽略无效的 SSE 数据行', error);
      }
    };

    let sseBuffer = '';
    while (true) {
      const { done, value } = await reader.read();
      sseBuffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      let newlineIndex;
      while ((newlineIndex = sseBuffer.indexOf('\n')) >= 0) {
        consumeSseLine(sseBuffer.slice(0, newlineIndex));
        sseBuffer = sseBuffer.slice(newlineIndex + 1);
      }
      if (done) {
        if (sseBuffer) consumeSseLine(sseBuffer);
        break;
      }
    }

    if (streamError) throw new Error(streamError);
    if (!reply) reply = '（网络不太稳，再试一次…）';
    companionVoice.finish();
    messages.push({ role: 'assistant', content: reply });
    if (reminderContext && reminderContext.requires_confirmation) {
      showReminderConfirmModal(reminderContext);
    }
    if (newsContext && Array.isArray(newsContext.article_ids) && newsContext.article_ids.length) {
      localStorage.setItem('companion_last_news_call', JSON.stringify(newsContext));
    }

    // Emotion stays an internal aid for the animation; a percentage can feel
    // like a diagnosis and is not shown to the person being accompanied.
    if (finalEmotion && finalEmotion.primary) {
      bubble.textContent = reply;
    } else {
      bubble.textContent = reply;
    }

    // Pet avatar animation from server-detected emotion
    if (finalEmotion && finalEmotion.primary) {
      const emotionToPet = {
        joy: 'joy', sadness: 'sadness', loneliness: 'loneliness',
        neutral: 'neutral', nostalgia: 'nostalgia', surprise: 'surprise',
        anger: 'anger', excited: 'excited', anxiety: 'sadness', blush: 'joy'
      };
      const petState = emotionToPet[finalEmotion.primary] || 'neutral';
      setPetState(petState, petState === 'sadness' || petState === 'loneliness' ? 5000 : 3000);
    }
    window.digitalAvatar?.play(finalAvatarAction || 'care');

    // Save to server
    roundNum++;
    try {
      await fetch('/v1/langgraph/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: turnAbortController.signal,
        body: JSON.stringify({
          session_id: sessionId,
          prompt_type: 'cn',
          round_number: roundNum,
          user_message: loggedUserText,
          sakura_reply: reply,
        }),
      });
    } catch (error) {
      console.warn('聊天记录保存失败', error);
    }

    const now = new Date();
    rounds.push({
      user: loggedUserText,
      reply: reply,
      time: now.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      emotion: finalEmotion || null,
    });
    updateLog();
    saveLog();

  } catch (e) {
    if (e?.name === 'AbortError') {
      bubble.textContent = '（已被您打断）';
    } else {
      companionVoice.cancel();
      bubble.textContent = '（网络不太好，稍等再试试…）';
      console.error(e);
    }
  }

  if (activeChatAbortController === turnAbortController) activeChatAbortController = null;
  messageSendBusy = false;
  resolveTurnCompletion();
  return true;
}

// ====== OLV 起床与跌倒事件主动关怀 ======
const detectionConsumerId = (() => {
  const storageKey = 'olv_detection_consumer_id';
  let value = localStorage.getItem(storageKey);
  if (!value) {
    value = 'companion_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now());
    localStorage.setItem(storageKey, value);
  }
  return value;
})();
const proactiveEventQueue = [];
let proactiveEventRunning = false;
let detectionEventSocket = null;

function detectionEventPrompt(event) {
  return '[系统内部事件，不是用户说的话] 用户刚刚从床上坐起。' +
    '请自然、温和、简短地主动开启对话，用一到两句话打招呼并轻轻询问睡眠或身体感受。' +
    '不要提到摄像头、检测系统、事件、报警、一级离床或坐起识别，' +
    '不要断言用户生病或处于危险中，也不要一次连续追问多个问题。' +
    '事件时间：' + event.occurred_at;
}

const FALL_SAFETY_MESSAGE =
  '您还好吗？刚才是不是发生了意外？先别急着起身。' +
  '请告诉我有没有撞到头、明显疼痛、出血或无法活动，您现在需要帮助吗？' +
  '如果有这些情况，或不能安全起身，请立即拨打120，或者大声呼叫身边的人、家属或护工。';

async function speakFixedFallResponse(event) {
  messageSendBusy = true;
  companionVoice.begin();
  window.digitalAvatar?.play('big_comfort');

  if (messages.length === 0) messages.push({ role: 'system', content: '' });
  messages.push({
    role: 'system',
    content: '[安全上下文] 系统发现用户可能刚刚跌倒。你不能拨打电话、呼叫急救或联系任何人。' +
      '绝对不要提出代叫救护车、代报警或代联系家属护工。后续应先确认用户能否回应、' +
      '是否撞到头、明显疼痛、出血或无法活动；如有严重情况，指导用户自己拨打120或呼喊身边人。' +
      '事件时间：' + event.occurred_at,
  });
  messages.push({ role: 'assistant', content: FALL_SAFETY_MESSAGE });

  addBubble('li', FALL_SAFETY_MESSAGE, 'li');
  companionVoice.push(FALL_SAFETY_MESSAGE);
  companionVoice.finish();

  roundNum++;
  fetch('/v1/langgraph/log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      session_id: sessionId,
      prompt_type: 'cn',
      round_number: roundNum,
      user_message: '安全关怀（检测到跌倒）',
      sakura_reply: FALL_SAFETY_MESSAGE,
    }),
  }).catch(() => {});

  rounds.push({
    user: '安全关怀（检测到跌倒）',
    reply: FALL_SAFETY_MESSAGE,
    time: new Date().toLocaleString('zh-CN', {
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    }),
    emotion: null,
  });
  updateLog();
  saveLog();
  messageSendBusy = false;
}

function enqueueProactiveEvent(event) {
  if (event.event_type === 'fall_detected') proactiveEventQueue.unshift(event);
  else proactiveEventQueue.push(event);
  void drainProactiveEvents();
}

const WAKE_ACKNOWLEDGEMENT = '我在呢';

function appendWakeAcknowledgement() {
  addBubble('li', WAKE_ACKNOWLEDGEMENT, 'li');
  if (messages.length === 0) messages.push({ role: 'system', content: '' });
  messages.push({ role: 'assistant', content: WAKE_ACKNOWLEDGEMENT });
}

function speakWakeAcknowledgement(source, options = {}) {
  if (!options.preserveWakeCapture) {
    window.companionVoice?.activateConversation?.(source);
  }
  if (!options.audioOnly) appendWakeAcknowledgement();
  if (options.visualOnly) return;
  window.digitalAvatar?.play('welcome');
  window.companionVoice?.speak?.(WAKE_ACKNOWLEDGEMENT, {
    preserveWakeCapture: Boolean(options.preserveWakeCapture),
  });
}

window.companionWaveGreeting = async function companionWaveGreeting() {
  // A wave is the conversational wake-up gesture. Microphone permission may
  // be requested the first time; after it is granted no voice button is needed.
  const voiceReady = await window.companionVoice?.start?.();
  if (!window.companionVoice?.isConversationAwake?.()) {
    speakWakeAcknowledgement('wave');
  }
  return voiceReady !== false;
};

window.companionVoiceWakeup = async function companionVoiceWakeup(_wake, options = {}) {
  speakWakeAcknowledgement('voice-wake', options);
  return true;
};

async function drainProactiveEvents() {
  if (proactiveEventRunning) return;
  proactiveEventRunning = true;
  try {
    while (proactiveEventQueue.length) {
      while (messageSendBusy) {
        await new Promise(resolve => setTimeout(resolve, 500));
      }
      const event = proactiveEventQueue.shift();
      if (event.event_type === 'fall_detected') {
        await speakFixedFallResponse(event);
      } else if (event.event_type === 'wave_detected' || event.event_type === 'voice_wake_detected') {
        const voiceReady = await window.companionVoice?.start?.();
        if (voiceReady !== false && !window.companionVoice?.isConversationAwake?.()) {
          speakWakeAcknowledgement(event.event_type === 'wave_detected' ? 'wave' : 'voice-wake');
        }
      } else {
        await send({ text: detectionEventPrompt(event), internalEvent: event });
      }
    }
  } finally {
    proactiveEventRunning = false;
  }
}

function connectDetectionEvents() {
  if (detectionEventSocket &&
      (detectionEventSocket.readyState === WebSocket.OPEN ||
       detectionEventSocket.readyState === WebSocket.CONNECTING)) return;

  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = protocol + '//' + window.location.host +
    '/api/detection-events/ws?consumer_id=' + encodeURIComponent(detectionConsumerId);
  const socket = new WebSocket(url);
  detectionEventSocket = socket;

  socket.onmessage = event => {
    try {
      const data = JSON.parse(event.data);
      const eventType = data.event?.event_type;
      if (data.type === 'detection-event' &&
          (eventType === 'sit_up' || eventType === 'fall_detected')) {
        enqueueProactiveEvent(data.event);
      }
    } catch (error) {
      console.warn('Invalid detection event message', error);
    }
  };
  socket.onclose = () => {
    if (detectionEventSocket === socket) detectionEventSocket = null;
    setTimeout(connectDetectionEvents, 2000);
  };
  socket.onerror = () => socket.close();
}

// ====== localStorage ======
const STORAGE_KEY = 'linainai_chat_log';

function saveLog() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ rounds, updated: new Date().toISOString() }));
  } catch (e) {}
}

function loadLog() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.rounds && data.rounds.length > 0) {
      rounds = data.rounds;
      updateLog();
      msgDiv.innerHTML = '';
      messages = [{ role: 'system', content: '' }];
      for (const r of rounds) {
        const uRow = document.createElement('div');
        uRow.className = 'msg-row user';
        uRow.innerHTML = `<div class="msg-avatar">🙋</div><div><div class="msg-bubble">${escapeHtml(r.user)}</div><div class="msg-time">${r.time}</div></div>`;
        msgDiv.appendChild(uRow);
        const sRow = document.createElement('div');
        sRow.className = 'msg-row li';
        sRow.innerHTML = `<div class="msg-avatar">💛</div><div><div class="msg-bubble">${escapeHtml(r.reply)}</div><div class="msg-time">${r.time}</div></div>`;
        msgDiv.appendChild(sRow);
        messages.push({ role: 'user', content: r.user });
        messages.push({ role: 'assistant', content: r.reply });
      }
      scrollDown();
      return true;
    }
  } catch (e) {}
  return false;
}

function exportLog() {
  const lines = [];
  lines.push('# 温暖陪伴聊天记录');
  lines.push(`# 导出时间: ${new Date().toLocaleString('zh-CN')}`);
  lines.push('');
  rounds.forEach((r, i) => {
    lines.push(`## 第${i + 1}轮 — ${r.time}`);
    lines.push(`🙋 用户: ${r.user}`);
    lines.push(`💛 陪伴: ${r.reply}`);
    lines.push('');
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `linainai_log_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function completeCurrentSession() {
  if (!sessionId || rounds.length === 0) return;
  const endpoint = `${COMPANION_API_ORIGIN}/v1/langgraph/logs/${encodeURIComponent(sessionId)}/complete`;
  const body = new Blob([''], { type: 'text/plain;charset=UTF-8' });
  if (navigator.sendBeacon) {
    navigator.sendBeacon(endpoint, body);
  } else {
    browserFetch(endpoint, { method: 'POST', keepalive: true }).catch(() => {});
  }
}

function clearLog() {
  completeCurrentSession();
  rounds = [];
  messages = [];
  sessionId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  roundNum = 0;
  updateLog();
  localStorage.removeItem(STORAGE_KEY);
  msgDiv.innerHTML = '';
}

window.addEventListener('pagehide', event => {
  if (event.persisted) return;
  completeCurrentSession();
  localStorage.removeItem(STORAGE_KEY);
});

if (!loadLog()) {
  messages = [];
}
fetchDialects();
updateNotificationButton();
connectDetectionEvents();
pollReminders();
setInterval(pollReminders, 15000);
refreshReminderCenter();
setInterval(refreshReminderCenter, 30000);

// ====== 历史记录 ======
async function showHistory() {
  document.getElementById('modalTitle').textContent = '聊天历史';
  const modal = document.getElementById('historyModal');
  modal.style.display = 'flex';
  const body = document.getElementById('modalBody');
  body.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-light)">加载中…</div>';
  try {
    const r = await fetch('/v1/langgraph/logs');
    const data = await r.json();
    if (!data.sessions || data.sessions.length === 0) {
      body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light)">还没有保存的聊天记录</div>';
      return;
    }
    body.innerHTML = data.sessions.map(s => `
      <div style="padding:14px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s"
           onmouseover="this.style.background='#fdf8f2'" onmouseout="this.style.background=''"
           onclick="viewSession('${s.session_id}')">
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${escapeHtml((s.first_msg || '(空)').substring(0, 50))}</div>
          <div style="font-size:11px;color:var(--text-light);margin-top:2px">${s.rounds}轮 · ${(s.last_active || '').slice(0,19).replace('T',' ')}</div>
        </div>
        <div style="font-size:11px;padding:2px 8px;border-radius:8px;background:var(--accent-light);color:var(--accent)">${s.rounds}轮</div>
      </div>
    `).join('');
  } catch (e) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:red">加载失败</div>';
  }
}

async function viewSession(sid) {
  document.getElementById('modalTitle').textContent = '聊天详情';
  const body = document.getElementById('modalBody');
  body.innerHTML = '<div style="text-align:center;padding:30px">加载中…</div>';
  try {
    const r = await fetch('/v1/langgraph/logs/' + sid);
    const data = await r.json();
    body.innerHTML = `
      <button onclick="showHistory()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;padding:4px 0;margin-bottom:12px">← 返回列表</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:12px;color:var(--text-light)">${data.rounds?.length || 0}轮</span>
        <button onclick="delSession('${sid}')" style="background:none;border:1px solid #e88;color:#d44;padding:4px 12px;border-radius:8px;cursor:pointer;font-size:12px">删除</button>
      </div>
      ${(data.rounds || []).map(r => `
        <div style="margin-bottom:16px;padding:12px;background:#fdfaf6;border-radius:10px">
          <div style="font-size:11px;color:var(--accent);font-weight:600">第${r.round_number}轮 · ${(r.created_at||'').slice(0,19).replace('T',' ')}</div>
          <div style="margin:4px 0;font-size:14px">🙋 ${escapeHtml(r.user_message)}</div>
          <div style="margin:4px 0;color:#c06040;font-size:14px">💛 ${escapeHtml(r.reply)}</div>
        </div>
      `).join('')}
    `;
  } catch (e) {
    body.innerHTML = '<div style="color:red">加载失败</div>';
  }
}

async function delSession(sid) {
  if (!confirm('确定删除这条聊天记录吗？')) return;
  await fetch('/v1/langgraph/logs/' + sid, { method: 'DELETE' });
  showHistory();
}

function closeHistory() {
  document.getElementById('historyModal').style.display = 'none';
}

document.getElementById('historyModal').addEventListener('click', function(e) {
  if (e.target === this) closeHistory();
});
